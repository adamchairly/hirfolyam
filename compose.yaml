name: hirfolyam
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    logging: *default-logging
    command:
      - postgres
      - -c
      - logging_collector=off
      - -c
      - log_destination=stderr
      - -c
      - log_min_messages=warning
      - -c
      - log_min_error_statement=error
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_lock_waits=on
      - -c
      - log_checkpoints=off
      - -c
      - "log_line_prefix=%m [%p] user=%u db=%d app=%a "
    environment:
      POSTGRES_DB: newsaggregator
      POSTGRES_USER: newsaggregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - news_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsaggregator -d newsaggregator"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    logging: *default-logging
    ports:
      - "5080:8080"
    environment:
      TZ: Europe/Budapest
      ConnectionStrings__NewsDatabase: Host=postgres;Database=newsaggregator;Username=newsaggregator;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Database__MigrateOnStartup: "true"
      OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    logging: *default-logging
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  news_data:
