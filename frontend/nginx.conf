map $status $log_failed_request {
    default 0;
    404 0;
    ~^[45] 1;
}

log_format application
    '[$time_iso8601] frontend: $request_method $uri status=$status '
    'duration=$request_time upstream_status=$upstream_status '
    'upstream_duration=$upstream_response_time request_id=$request_id';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout application if=$log_failed_request;
    error_log /dev/stderr warn;
    log_not_found off;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sources {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
